<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF5E6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE4C4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg1)"/>
  
  <!-- Decorative Umbrella -->
  <path d="M600 300 Q700 100 800 300" stroke="#8B4513" stroke-width="5" fill="#FF7F50" opacity="0.8"/>
