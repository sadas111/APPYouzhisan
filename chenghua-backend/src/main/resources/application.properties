spring.application.name=chenghua-backend

# Datasource Configuration (H2)
spring.datasource.url=jdbc:h2:mem:chenghua;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true

# Datasource Configuration (MySQL)
# spring.datasource.url=jdbc:mysql://localhost:3306/chenghua?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=123456
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Server Configuration
server.port=8080
 
# BigModel API Key
bigmodel.api.key=${BIGMODEL_API_KEY:}

# JWT (DEV defaults; for production move to env/secret manager)
# HS256 secret must be >= 32 bytes
security.jwt.secret=change-me-to-a-very-long-random-secret-32bytes+
security.jwt.expiration-ms=3600000
security.jwt.issuer=chenghua-backend
